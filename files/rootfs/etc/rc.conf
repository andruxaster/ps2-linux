# PS2 Linux boot settings. Read by /etc/init.d/rcS.

HOSTNAME=ps2

# Console keymap (busybox loadkmap binary format) and font (PSF).
# Empty = kernel defaults (US keyboard, built-in font).
KEYMAP=
FONT=

# Network: USB Ethernet interface. NET=dhcp | static | off
NET=dhcp
IFACE=eth0
# for NET=static:
IP=192.168.1.201/24
GATEWAY=192.168.1.1
DNS=192.168.1.1

# Time sync over the internet (empty = off)
NTP_SERVER=pool.ntp.org

# dropbear SSH server: yes | no
SSHD=yes

# Compressed swap in RAM (kernel PROFILE=fast): yes | no.
# ZRAM_SIZE is the uncompressed size; LZ4 compresses 2-3x, so 16M uses ~6 MB of RAM.
ZRAM=yes
ZRAM_SIZE=16M
ZRAM_ALGO=lz4
# How eagerly the kernel swaps (0-100); higher is better with zram.
SWAPPINESS=100

# Extra swap file on the USB stick (USB 1.1 is slow; lower priority than zram).
# Example: SWAPFILE=/swapfile  (create: dd if=/dev/zero of=/swapfile bs=1M count=64; mkswap /swapfile)
SWAPFILE=
