# Настройки загрузки PS2 Linux. Читается /etc/init.d/rcS.

HOSTNAME=ps2

# Консоль: раскладка us,ru (переключение Alt+Shift) и шрифт с кириллицей.
# Пустое значение — не загружать.
KEYMAP=/usr/share/keymaps/ru.bmap
FONT=/usr/share/consolefonts/CyrSlav-Fixed16.psf

# Сеть: интерфейс USB-Ethernet. NET=dhcp | static | off
NET=dhcp
IFACE=eth0
# для NET=static:
IP=192.168.1.201/24
GATEWAY=192.168.1.1
DNS=192.168.1.1

# Синхронизация времени с интернетом (пусто — выключено)
NTP_SERVER=pool.ntp.org

# SSH-сервер dropbear: yes | no
SSHD=yes

# Сжатый swap в RAM (ядро PROFILE=fast): yes | no.
# ZRAM_SIZE — объём до сжатия; LZ4 сжимает в 2–3 раза, т. е. 16M занимают ~6 МБ RAM.
ZRAM=yes
ZRAM_SIZE=16M
ZRAM_ALGO=lz4
# Насколько охотно ядро уходит в swap (0–100); для zram выгодно повыше.
SWAPPINESS=100

# Дополнительный swap-файл на флешке (USB 1.1 — медленно, приоритет ниже zram).
# Пример: SWAPFILE=/swapfile  (создать: dd if=/dev/zero of=/swapfile bs=1M count=64; mkswap /swapfile)
SWAPFILE=
